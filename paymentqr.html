<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayNow Payment — Chicken Supremo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #211f1c; color: #fff8e6; font-family: 'Segoe UI', Arial, sans-serif; }
  main { width: min(560px, 100%); background: #2e2b26; border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 28px; }
  h1 { color: #ffd400; margin: 0 0 8px; font-size: 1.5rem; }
  .total { font-size: 2rem; color: #ffd400; font-weight: 800; margin: 12px 0; }
  .note { color: rgba(255,248,230,.75); line-height: 1.5; }
  .qr-wrap { background: #fff; margin: 22px auto; padding: 12px; width: fit-content; border-radius: 10px; }
  #qr { width: min(280px, 72vw); height: auto; }
  .recipient { text-align: center; font-size: .9rem; margin-top: -10px; }
  label { display: block; margin: 24px 0 7px; font-size: .9rem; font-weight: 700; }
  input { display: block; width: 100%; padding: 12px; color: #fff8e6; background: #211f1c; border: 1px solid #746d62; border-radius: 7px; }
  button, .back { display: block; width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 7px; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; }
  button { background: #d2251c; color: #fff; } button:disabled { opacity: .6; cursor: wait; }
  .back { background: transparent; color: #ffd400; border: 1px solid #ffd400; }
  .warning { padding: 11px; border: 1px solid #ffd400; background: rgba(255,212,0,.08); color: #fff8e6; border-radius: 7px; font-size: .85rem; margin-top: 18px; }
  #error { color: #ff9e96; margin-top: 14px; min-height: 1.2em; }
  #loading { text-align: center; color: #ffd400; }
</style>
</head>
<body>
<main>
  <h1>Complete your PayNow payment</h1>
  <p class="note">Scan the QR with your banking app and pay the exact amount shown.</p>
  <div id="loading">Generating your payment QR…</div>
  <div id="payment" hidden>
    <div class="total" id="total"></div>
    <div class="qr-wrap"><img id="qr" alt="PayNow QR code"></div>
    <p class="recipient" id="recipient"></p>
    <p class="warning">Before paying, check that your banking app shows the intended recipient and the exact amount. Do not proceed if either detail is wrong.</p>
    <form id="proof-form">
      <label for="payment-proof">Upload your payment screenshot (PNG or JPG, max 5 MB)</label>
      <input id="payment-proof" type="file" accept="image/png,image/jpeg" required>
      <button id="submit-btn" type="submit">Submit proof &amp; place order</button>
    </form>
  </div>
  <p id="error" role="alert"></p>
  <a class="back" href="chicken-supremo-ntu.html">← Back to menu</a>
</main>
<script>
<script>
  const API = 'https://chicken-supremo-2.onrender.com';
  let order;
  try { order = JSON.parse(sessionStorage.getItem('pendingOrder')); } catch (_) { order = null; }
  if (!order || !Array.isArray(order.items) || !order.items.length) {
    document.getElementById('loading').hidden = true;
    document.getElementById('error').textContent = 'Your checkout session has expired. Please return to the menu and try again.';
  } else { loadQr(); }

  async function loadQr() {
    try {
      const response = await fetch(`${API}/api/paynow-qr`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: order.items })
      });
      
      const rawText = await response.text();
      let result;
      try {
        result = JSON.parse(rawText);
      } catch (e) {
        throw new Error('Server returned an invalid response while fetching the QR code.');
      }

      if (!response.ok || !result.success) throw new Error(result.error || 'Could not generate the QR code.');
      document.getElementById('total').textContent = `$${Number(result.amount).toFixed(2)}`;
      document.getElementById('recipient').textContent = `PayNow to ${result.recipient} · ${result.mobile}`;
      document.getElementById('qr').src = result.qrDataUrl;
      document.getElementById('loading').hidden = true;
      document.getElementById('payment').hidden = false;
    } catch (error) {
      document.getElementById('loading').hidden = true;
      document.getElementById('error').textContent = error.message || 'Could not reach the payment server.';
    }
  }

  document.getElementById('proof-form').addEventListener('submit', async event => {
    event.preventDefault();
    const proof = document.getElementById('payment-proof').files[0];
    if (!proof) return;
    const submit = document.getElementById('submit-btn');
    submit.disabled = true; submit.textContent = 'Submitting…';
    const form = new FormData();
    form.append('order', JSON.stringify(order));
    form.append('paymentProof', proof);
    try {
      const response = await fetch(`${API}/api/orders/paynow`, { method: 'POST', body: form });
      
      const rawText = await response.text();
      let result;
      try {
        result = JSON.parse(rawText);
      } catch (e) {
        throw new Error(`Server Error (${response.status}): The server returned an error page instead of confirming your order.`);
      }

      if (!response.ok || !result.success) throw new Error(result.error || 'Could not submit your order.');
      sessionStorage.removeItem('pendingOrder');
      document.querySelector('main').innerHTML = `<h1>Order submitted</h1><p class="total">Order #${result.orderId}</p><p class="note">Your payment screenshot has been sent for manual verification. Your order is <strong>pending</strong>.</p><p class="note">${result.emailSent ? 'A pending-order receipt has been emailed to you.' : 'Your order was recorded. The shop still needs to configure email delivery.'}</p><a class="back" href="chicken-supremo-ntu.html">Return to menu</a>`;
    } catch (error) {
      document.getElementById('error').textContent = error.message || 'Could not submit your order.';
      submit.disabled = false; submit.textContent = 'Submit proof & place order';
    }
  });
</script>

</body>
</html>
